services:
  cnsec-api:
    image: python:3.12-slim
    working_dir: /workspace
    command: >
      sh -lc "pip install --no-cache-dir -r apps/api/requirements.txt &&
      PYTHONPATH=apps/api python -m cloudnative_security.cli
      --serve --host 0.0.0.0 --port 18080 --sqlite artifacts/assessment.sqlite3"
    ports:
      - "18080:18080"
    volumes:
      - .:/workspace
