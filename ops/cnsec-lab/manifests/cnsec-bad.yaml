  ns: cnsec-bad
  pod: postgres-bad-0
  container: postgres
---
apiVersion: fixtures.cnsec/v1
kind: ScaleEvent
metadata:
  name: web-bad-manual-scale-3
  namespace: cnsec-bad
  creationTimestamp: "2026-06-22T10:05:00Z"
actor: alice@example.test
target:
  kind: Deployment
  namespace: cnsec-bad
  name: web-bad
current_replicas: 80
desired_replicas: 90
message: repeated manual scale within 10 minutes
---
apiVersion: batch/v1
kind: Job
metadata:
  name: no-ttl-job
  namespace: cnsec-bad
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: hello
        image: busybox:latest
        command: ["sh", "-c", "echo no ttl; sleep 5"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orphan-demo-config
  namespace: cnsec-bad
data:
  unused.conf: demo
---
apiVersion: v1
kind: Secret
metadata:
  name: orphan-demo-secret
  namespace: cnsec-bad
type: Opaque
stringData:
  demo-key: placeholder
---
apiVersion: fixtures.cnsec/v1
kind: RegistryEndpoint
metadata:
  name: registry-bad
url: http://10.20.0.1:5000
tls_enabled: false
anonymous_pull: true
robot_account: null
robot_account_scope: admin
audit_enabled: false
---
apiVersion: fixtures.cnsec/v1
kind: RegistryAuditEvent
metadata:
  name: registry-anonymous-pull
  creationTimestamp: "2026-06-22T10:10:00Z"
registry: 10.20.0.1:5000
repository: insecure/nginx
action: pull
actor: anonymous
result: success
---
apiVersion: fixtures.cnsec/v1
kind: RegistryAuditEvent
metadata:
  name: registry-delete-tag
  creationTimestamp: "2026-06-22T10:12:00Z"
registry: 10.20.0.1:5000
repository: insecure/nginx
action: delete_tag
actor: admin
result: success
---
apiVersion: aquasecurity.github.io/v1alpha1
kind: VulnerabilityReport
metadata:
  name: web-bad-nginx
  namespace: cnsec-bad
report:
  artifact:
    repository: insecure/nginx
    tag: latest
  summary:
    criticalCount: 1
    highCount: 2
    mediumCount: 4
    lowCount: 0
---
apiVersion: aquasecurity.github.io/v1alpha1
kind: SecretReport
metadata:
  name: web-bad-secrets
  namespace: cnsec-bad
report:
  artifact:
    repository: insecure/nginx
    tag: latest
  summary:
    secretCount: 1
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: insecure-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: Immediate
reclaimPolicy: Delete
allowVolumeExpansion: true
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: cnsec-hostpath-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: insecure-local
  hostPath:
    path: /tmp/cnsec-hostpath-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: cnsec-bad
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: insecure-local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-bad
  namespace: cnsec-bad
spec:
  serviceName: postgres-bad
  replicas: 1
  selector:
    matchLabels:
      app: postgres-bad
  template:
    metadata:
      labels:
        app: postgres-bad
    spec:
      containers:
      - name: postgres
        image: postgres:latest
        env:
        - name: POSTGRES_PASSWORD
          value: plain-text-password
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: db-data
---
apiVersion: v1
kind: Pod
metadata:
  name: db-data-debug-mounter
  namespace: cnsec-bad
spec:
  containers:
  - name: debug
    image: busybox:latest
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: data
      mountPath: /var/lib/kubelet/pods
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: db-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-bad
  namespace: cnsec-bad
spec:
  type: NodePort
  selector:
    app: postgres-bad
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
    nodePort: 30432
