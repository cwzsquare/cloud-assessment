  namespace: cnsec-bad
  creationTimestamp: "2026-06-22T10:08:00Z"
reason: FailedMount
message: "MountVolume.SetUp failed for PVC db-data: forbidden hostPath /etc"
involvedObject:
  kind: Pod
  namespace: cnsec-bad
