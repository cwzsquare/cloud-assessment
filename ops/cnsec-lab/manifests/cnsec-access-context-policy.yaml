apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cnsec-business-context-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  matchConditions:
  - name: business-namespace
    expression: "request.namespace == 'cnsec-good' || request.namespace == 'cnsec-bad'"
  - name: trusted-subject
    expression: "request.userInfo.username.startsWith('system:serviceaccount:') || request.userInfo.groups.exists(g, g == 'platform-admins')"
  validations:
  - expression: "has(object.metadata.labels) && has(object.metadata.labels.env) && has(object.metadata.labels.tenant)"
    message: "business pods must declare env and tenant labels"
  - expression: "object.metadata.namespace == request.namespace"
    message: "request namespace must match object namespace"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cnsec-business-context-guard-binding
spec:
  policyName: cnsec-business-context-guard
  validationActions: [Audit]
